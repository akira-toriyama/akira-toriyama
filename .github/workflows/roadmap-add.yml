name: roadmap-add

# Aggregate every OPEN issue from the roadmap repos into project #5 (akira-toriyama/roadmap).
# The built-in "Auto-add to project" workflow is capped at 1 repo (Free) / 5 (Pro-Team), so it
# cannot cover all repos. This sweeps them all for free.
# Triggers: every 15 min (GitHub may delay scheduled runs) and on-demand via
#   gh workflow run roadmap-add.yml -R akira-toriyama/akira-toriyama
#
# Uses gh api graphql directly (not `gh project`, which needs owner-type resolution and
# fails with "unknown owner type" when the PAT only carries the `project` scope).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: roadmap-add
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ROADMAP_PROJECT_PAT }}
      OWNER: akira-toriyama
      PROJECT: '5'
      REPOS: 'facet chord halo perch wand canon dotfiles glossary-site excalidraw-claude-code'
    steps:
      - name: Add open issues not yet on the board
        run: |
          set -euo pipefail

          # Project node id.
          PID="$(gh api graphql -f query='
            query($o:String!,$n:Int!){ user(login:$o){ projectV2(number:$n){ id } } }' \
            -f o="$OWNER" -F n="$PROJECT" -q '.data.user.projectV2.id')"

          # URLs already on the board (paginated; drafts have no url -> dropped).
          existing="$(gh api graphql --paginate -f query='
            query($o:String!,$n:Int!,$endCursor:String){
              user(login:$o){ projectV2(number:$n){ items(first:100, after:$endCursor){
                pageInfo{ hasNextPage endCursor }
                nodes{ content{ ... on Issue{url} ... on PullRequest{url} } }
              } } }
            }' -f o="$OWNER" -F n="$PROJECT" \
            -q '.data.user.projectV2.items.nodes[].content.url // empty' | sort -u)"

          added=0
          for repo in $REPOS; do
            # gh issue list returns issues only (PRs excluded) == is:issue; id is the node id.
            while IFS=$'\t' read -r cid url; do
              [ -z "${url:-}" ] && continue
              if ! grep -qxF "$url" <<<"$existing"; then
                echo "add: $url"
                gh api graphql -f query='
                  mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item{ id } } }' \
                  -f p="$PID" -f c="$cid" >/dev/null
                added=$((added+1))
              fi
            done < <(gh issue list -R "$OWNER/$repo" --state open --limit 1000 --json id,url -q '.[] | [.id, .url] | @tsv')
          done
          echo "done: added $added new issue(s)"
